server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend (including WebSocket upgrades)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # index.html must never be cached — after a frontend rebuild the hashed
    # asset filenames change, and a stale index.html causes "Failed to fetch
    # dynamically imported module" errors for every lazy-loaded chunk.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    # Hashed assets are content-addressed and safe to cache indefinitely.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
