# NeuroForge artifact type vocabulary.
# Each slug is stable — rename only with a migration.
# Manifests reference these slugs in accepts[].type and produces[].type.

artifact_types:

  nifti_raw:
    label: "Raw NIfTI"
    description: "Unprocessed structural or functional NIfTI image (T1w, T2w, BOLD, etc.)"
    extensions: [".nii", ".nii.gz"]

  nifti_skull_stripped:
    label: "Skull-Stripped Brain"
    description: "NIfTI image with non-brain tissue removed"
    extensions: [".nii", ".nii.gz"]

  brain_mask:
    label: "Brain Mask"
    description: "Binary NIfTI mask distinguishing brain (1) from background (0)"
    extensions: [".nii", ".nii.gz"]

  nifti_defaced:
    label: "Defaced NIfTI"
    description: "NIfTI image with facial features removed for de-identification"
    extensions: [".nii", ".nii.gz"]

  bids_dataset:
    label: "BIDS Dataset"
    description: "A directory conforming to the Brain Imaging Data Structure standard"
    extensions: []

  bids_dataset_validated:
    label: "Validated BIDS Dataset"
    description: "A BIDS dataset that has passed bids-validator with no errors"
    extensions: []

  freesurfer_dir:
    label: "FreeSurfer Subject Directory"
    description: "Output directory from recon-all or FastSurfer containing surf/, mri/, stats/"
    extensions: []

  mriqc_report:
    label: "MRIQC Report"
    description: "MRIQC participant-level output directory containing subject HTML reports and IQM JSON files"
    extensions: []

  mriqc_group_report:
    label: "MRIQC Group Report"
    description: "MRIQC group-level output directory containing aggregate HTML reports and group IQM TSV tables"
    extensions: []

  fmriprep_derivatives:
    label: "fMRIPrep Derivatives"
    description: "fMRIPrep output derivatives directory with preprocessed NIfTI and confounds"
    extensions: []

  connectivity_matrix_csv:
    label: "Connectivity Matrix CSV"
    description: "ROI-by-ROI Pearson correlation matrix as a CSV file"
    extensions: [".csv"]

  connectivity_matrix_png:
    label: "Connectivity Heatmap"
    description: "PNG heatmap visualization of the functional connectivity matrix"
    extensions: [".png"]

  connectivity_matrix_npy:
    label: "Connectivity Matrix NPY"
    description: "NumPy binary array containing the ROI-by-ROI connectivity matrix"
    extensions: [".npy"]

  timeseries_tsv:
    label: "Atlas Time Series"
    description: "Extracted ROI time series used to compute the connectivity matrix"
    extensions: [".tsv"]

  roi_statistics_csv:
    label: "ROI Statistics CSV"
    description: "Per-ROI atlas voxel counts and time-series summary statistics as a CSV file"
    extensions: [".csv"]

  roi_statistics_json:
    label: "ROI Statistics JSON"
    description: "Machine-readable per-ROI atlas statistics in JSON format"
    extensions: [".json"]

  connectivity_report_html:
    label: "Connectivity Report"
    description: "HTML report summarizing atlas, method, matrix statistics, and outputs"
    extensions: [".html"]

  seed_connectivity_map_nii:
    label: "Seed Connectivity Map"
    description: "Voxelwise Fisher z-transformed Pearson correlation map from a seed ROI"
    extensions: [".nii", ".nii.gz"]

  seed_connectivity_map_png:
    label: "Seed Connectivity Map PNG"
    description: "Glass-brain PNG visualization of the seed-based connectivity map"
    extensions: [".png"]

  seed_timeseries_tsv:
    label: "Seed Time Series"
    description: "Extracted seed ROI time series used to compute the connectivity map"
    extensions: [".tsv"]

  seed_report_html:
    label: "Seed Connectivity Report"
    description: "HTML report summarizing the seed ROI, atlas, correlation map statistics, and outputs"
    extensions: [".html"]

  group_mean_matrix_csv:
    label: "Group Mean Connectivity Matrix"
    description: "Mean ROI-by-ROI connectivity matrix averaged across all input runs, as CSV"
    extensions: [".csv"]

  group_mean_matrix_npy:
    label: "Group Mean Connectivity Matrix (NPY)"
    description: "Mean ROI-by-ROI connectivity matrix as a NumPy binary array"
    extensions: [".npy"]

  group_mean_heatmap_png:
    label: "Group Mean Connectivity Heatmap"
    description: "Heatmap PNG of the mean connectivity matrix"
    extensions: [".png"]

  group_std_matrix_csv:
    label: "Group Std Connectivity Matrix"
    description: "Standard deviation of the ROI-by-ROI connectivity matrices across runs, as CSV"
    extensions: [".csv"]

  group_std_heatmap_png:
    label: "Group Std Connectivity Heatmap"
    description: "Heatmap PNG of the across-run standard deviation connectivity matrix"
    extensions: [".png"]

  group_summary_json:
    label: "Group Summary"
    description: "Machine-readable JSON summary of group-level connectivity aggregation"
    extensions: [".json"]

  group_report_html:
    label: "Group Connectivity Report"
    description: "HTML report summarizing group mean/std matrices, n_runs, atlas, and statistics"
    extensions: [".html"]

  nifti_inspector_json:
    label: "NIfTI Inspection Results"
    description: "Header metadata, image QC stats, warnings, and provenance from NIfTI Inspector"
    extensions: [".json"]

  nifti_histogram_png:
    label: "Intensity Histogram"
    description: "Intensity histogram of the inspected NIfTI image (5th–95th percentile range)"
    extensions: [".png"]

  nifti_inspector_report_html:
    label: "NIfTI Inspector Report"
    description: "Self-contained HTML report with header metadata, image QC statistics, and warnings"
    extensions: [".html"]

  roi_extraction_csv:
    label: "ROI Extraction CSV"
    description: "Per-ROI atlas statistics table as CSV (mean, median, std, percentiles, coverage)"
    extensions: [".csv"]

  roi_extraction_json:
    label: "ROI Extraction JSON"
    description: "Machine-readable per-ROI atlas statistics array in JSON format"
    extensions: [".json"]

  roi_extraction_metadata_json:
    label: "ROI Extraction Metadata"
    description: "Provenance and run metadata for the atlas ROI extraction (atlas, geometry, software versions)"
    extensions: [".json"]

  roi_extraction_report_html:
    label: "ROI Extraction Report"
    description: "Self-contained HTML report with atlas metadata, per-ROI statistics table, and provenance"
    extensions: [".html"]

  atlas_resampled_nii:
    label: "Resampled Atlas NIfTI"
    description: "Atlas label image resampled to input image space using nearest-neighbour interpolation"
    extensions: [".nii", ".nii.gz"]
