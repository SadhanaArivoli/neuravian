# NeuroForge artifact type vocabulary.
# Each slug is stable — rename only with a migration.
# Manifests reference these slugs in accepts[].type and produces[].type.

artifact_types:

  alff_map_nii:
    label: "Raw ALFF Map"
    description: "Voxelwise amplitude of low-frequency fluctuations"
    extensions: [".nii", ".nii.gz"]
  falff_map_nii:
    label: "Raw fALFF Map"
    description: "Voxelwise fractional amplitude of low-frequency fluctuations"
    extensions: [".nii", ".nii.gz"]
  alff_normalized_map_nii:
    label: "Normalized ALFF Map"
    description: "Optional mean-normalized or z-standardized ALFF map"
    extensions: [".nii", ".nii.gz"]
  falff_normalized_map_nii:
    label: "Normalized fALFF Map"
    description: "Optional mean-normalized or z-standardized fALFF map"
    extensions: [".nii", ".nii.gz"]
  alff_histogram_png: {label: "ALFF Histogram", description: "ALFF value distribution", extensions: [".png"]}
  falff_histogram_png: {label: "fALFF Histogram", description: "fALFF value distribution", extensions: [".png"]}
  alff_spectral_summary_png: {label: "Spectral Summary", description: "Mean masked FFT amplitude spectrum", extensions: [".png"]}
  alff_falff_metadata_json: {label: "ALFF / fALFF Metadata", description: "Machine-readable spectral provenance", extensions: [".json"]}
  alff_falff_report_html: {label: "ALFF / fALFF Report", description: "Descriptive ALFF/fALFF analysis report", extensions: [".html"]}

  nifti_raw:
    label: "Raw NIfTI"
    description: "Unprocessed structural or functional NIfTI image (T1w, T2w, BOLD, etc.)"
    extensions: [".nii", ".nii.gz"]

  nifti_skull_stripped:
    label: "Skull-Stripped Brain"
    description: "NIfTI image with non-brain tissue removed"
    extensions: [".nii", ".nii.gz"]

  brain_mask:
    label: "Brain Mask"
    description: "Binary NIfTI mask distinguishing brain (1) from background (0)"
    extensions: [".nii", ".nii.gz"]

  nifti_defaced:
    label: "Defaced NIfTI"
    description: "NIfTI image with facial features removed for de-identification"
    extensions: [".nii", ".nii.gz"]

  bids_dataset:
    label: "BIDS Dataset"
    description: "A directory conforming to the Brain Imaging Data Structure standard"
    extensions: []

  bids_dataset_validated:
    label: "Validated BIDS Dataset"
    description: "A BIDS dataset that has passed bids-validator with no errors"
    extensions: []

  bids_validation_report:
    label: "BIDS Validation Report"
    description: "Human-readable or JSON BIDS Validator results"
    extensions: [".txt", ".json"]

  freesurfer_dir:
    label: "FreeSurfer Subject Directory"
    description: "Output directory from recon-all or FastSurfer containing surf/, mri/, stats/"
    extensions: []

  mriqc_report:
    label: "MRIQC Report"
    description: "MRIQC participant-level output directory containing subject HTML reports and IQM JSON files"
    extensions: []

  mriqc_group_report:
    label: "MRIQC Group Report"
    description: "MRIQC group-level output directory containing aggregate HTML reports and group IQM TSV tables"
    extensions: []

  fmriprep_derivatives:
    label: "fMRIPrep Derivatives"
    description: "fMRIPrep output derivatives directory with preprocessed NIfTI and confounds"
    extensions: []

  connectivity_matrix_csv:
    label: "Connectivity Matrix CSV"
    description: "ROI-by-ROI Pearson correlation matrix as a CSV file"
    extensions: [".csv"]

  connectivity_matrix_png:
    label: "Connectivity Heatmap"
    description: "PNG heatmap visualization of the functional connectivity matrix"
    extensions: [".png"]

  connectivity_matrix_npy:
    label: "Connectivity Matrix NPY"
    description: "NumPy binary array containing the ROI-by-ROI connectivity matrix"
    extensions: [".npy"]

  timeseries_tsv:
    label: "Atlas Time Series"
    description: "Extracted ROI time series used to compute the connectivity matrix"
    extensions: [".tsv"]

  roi_statistics_csv:
    label: "ROI Statistics CSV"
    description: "Per-ROI atlas voxel counts and time-series summary statistics as a CSV file"
    extensions: [".csv"]

  roi_statistics_json:
    label: "ROI Statistics JSON"
    description: "Machine-readable per-ROI atlas statistics in JSON format"
    extensions: [".json"]

  connectivity_report_html:
    label: "Connectivity Report"
    description: "HTML report summarizing atlas, method, matrix statistics, and outputs"
    extensions: [".html"]

  seed_connectivity_map_nii:
    label: "Seed Connectivity Map"
    description: "Voxelwise Fisher z-transformed Pearson correlation map from a seed ROI"
    extensions: [".nii", ".nii.gz"]

  seed_connectivity_map_png:
    label: "Seed Connectivity Map PNG"
    description: "Glass-brain PNG visualization of the seed-based connectivity map"
    extensions: [".png"]

  seed_timeseries_tsv:
    label: "Seed Time Series"
    description: "Extracted seed ROI time series used to compute the connectivity map"
    extensions: [".tsv"]

  seed_report_html:
    label: "Seed Connectivity Report"
    description: "HTML report summarizing the seed ROI, atlas, correlation map statistics, and outputs"
    extensions: [".html"]

  # Legacy artifact types — produced by group-FC runs before v0.1.1.
  # Kept so that old run records remain resolvable.
  group_mean_matrix_csv:
    label: "Group Mean Connectivity Matrix (legacy)"
    description: "Legacy: raw-r mean matrix (pre-Fisher-z). Use group_mean_r_matrix_csv for new runs."
    extensions: [".csv"]

  group_mean_matrix_npy:
    label: "Group Mean Connectivity Matrix NPY (legacy)"
    description: "Legacy: raw-r mean matrix as NumPy binary (pre-Fisher-z)."
    extensions: [".npy"]

  group_mean_heatmap_png:
    label: "Group Mean Connectivity Heatmap (legacy)"
    description: "Legacy: heatmap of raw-r mean matrix (pre-Fisher-z)."
    extensions: [".png"]

  group_std_matrix_csv:
    label: "Group Std Connectivity Matrix (legacy)"
    description: "Legacy: raw-r standard deviation matrix (pre-Fisher-z)."
    extensions: [".csv"]

  group_std_heatmap_png:
    label: "Group Std Connectivity Heatmap (legacy)"
    description: "Legacy: heatmap of raw-r std matrix (pre-Fisher-z)."
    extensions: [".png"]

  # Current Fisher-z artifact types (v0.1.1+)
  group_mean_r_matrix_csv:
    label: "Group Mean Connectivity Matrix (r)"
    description: "Mean Pearson r matrix back-transformed from Fisher z-space via tanh(mean_z)"
    extensions: [".csv"]

  group_mean_r_matrix_npy:
    label: "Group Mean Connectivity Matrix (r, NPY)"
    description: "NumPy binary of the back-transformed mean r matrix"
    extensions: [".npy"]

  group_mean_r_heatmap_png:
    label: "Group Mean Connectivity Heatmap (r)"
    description: "Heatmap of the group mean correlation matrix in r-space"
    extensions: [".png"]

  group_mean_fisher_z_matrix_csv:
    label: "Group Mean Connectivity Matrix (Fisher z)"
    description: "Mean connectivity in Fisher z-space (arctanh); use for group statistical analyses"
    extensions: [".csv"]

  group_mean_fisher_z_matrix_npy:
    label: "Group Mean Connectivity Matrix (Fisher z, NPY)"
    description: "NumPy binary of the mean Fisher z matrix"
    extensions: [".npy"]

  group_mean_fisher_z_heatmap_png:
    label: "Group Mean Connectivity Heatmap (Fisher z)"
    description: "Heatmap of the group mean connectivity in Fisher z-space"
    extensions: [".png"]

  group_std_fisher_z_matrix_csv:
    label: "Group Std Connectivity Matrix (Fisher z)"
    description: "Sample standard deviation (ddof=1) in Fisher z-space across input runs"
    extensions: [".csv"]

  group_std_fisher_z_matrix_npy:
    label: "Group Std Connectivity Matrix (Fisher z, NPY)"
    description: "NumPy binary of the z-space standard deviation matrix"
    extensions: [".npy"]

  group_std_fisher_z_heatmap_png:
    label: "Group Std Connectivity Heatmap (Fisher z)"
    description: "Heatmap of across-run standard deviation in Fisher z-space"
    extensions: [".png"]

  group_summary_json:
    label: "Group Summary"
    description: "Machine-readable JSON summary of group-level connectivity aggregation"
    extensions: [".json"]

  group_report_html:
    label: "Group Connectivity Report"
    description: "HTML report summarizing group mean/std matrices, n_runs, atlas, and statistics"
    extensions: [".html"]

  nifti_inspector_json:
    label: "NIfTI Inspection Results"
    description: "Header metadata, image QC stats, warnings, and provenance from NIfTI Inspector"
    extensions: [".json"]

  nifti_histogram_png:
    label: "Intensity Histogram"
    description: "Intensity histogram of the inspected NIfTI image (5th–95th percentile range)"
    extensions: [".png"]

  nifti_inspector_report_html:
    label: "NIfTI Inspector Report"
    description: "Self-contained HTML report with header metadata, image QC statistics, and warnings"
    extensions: [".html"]

  roi_extraction_csv:
    label: "ROI Extraction CSV"
    description: "Per-ROI atlas statistics table as CSV (mean, median, std, percentiles, coverage)"
    extensions: [".csv"]

  roi_extraction_json:
    label: "ROI Extraction JSON"
    description: "Machine-readable per-ROI atlas statistics array in JSON format"
    extensions: [".json"]

  roi_extraction_metadata_json:
    label: "ROI Extraction Metadata"
    description: "Provenance and run metadata for the atlas ROI extraction (atlas, geometry, software versions)"
    extensions: [".json"]

  roi_extraction_report_html:
    label: "ROI Extraction Report"
    description: "Self-contained HTML report with atlas metadata, per-ROI statistics table, and provenance"
    extensions: [".html"]

  atlas_resampled_nii:
    label: "Resampled Atlas NIfTI"
    description: "Atlas label image resampled to input image space using nearest-neighbour interpolation"
    extensions: [".nii", ".nii.gz"]

  graph_metrics_json:
    label: "Graph Metrics JSON"
    description: "Global graph-theoretic metrics: efficiency, clustering, modularity, path length, density"
    extensions: [".json"]

  graph_node_metrics_csv:
    label: "Node Metrics CSV"
    description: "Per-node graph metrics: degree, strength, clustering, betweenness, participation coefficient, community"
    extensions: [".csv"]

  graph_edge_list_csv:
    label: "Edge List CSV"
    description: "Thresholded edge list with source, target, and weight columns"
    extensions: [".csv"]

  graph_adjacency_npy:
    label: "Thresholded Adjacency Matrix"
    description: "NumPy binary array of the thresholded weighted adjacency matrix"
    extensions: [".npy"]

  graph_report_html:
    label: "Graph Analysis Report"
    description: "Self-contained HTML report with global metrics, node table, and provenance"
    extensions: [".html"]

  graph_summary_png:
    label: "Graph Summary Figure"
    description: "Degree distribution histogram and hub ranking bar chart"
    extensions: [".png"]

  # ── Regional Homogeneity (ReHo) ─────────────────────────────────────────────

  reho_map_nii:
    label: "ReHo Map"
    description: "Voxelwise Kendall's Coefficient of Concordance (KCC W) map"
    extensions: [".nii", ".nii.gz"]

  reho_normalized_map_nii:
    label: "Normalized ReHo Map"
    description: "Z-score normalized KCC map within the brain mask"
    extensions: [".nii", ".nii.gz"]

  reho_histogram_png: {label: "ReHo Histogram", description: "KCC value distribution within brain mask", extensions: [".png"]}
  reho_metadata_json: {label: "ReHo Metadata", description: "KCC parameters, statistics, versions, and warnings", extensions: [".json"]}
  reho_report_html: {label: "ReHo Report", description: "Self-contained ReHo analysis report", extensions: [".html"]}

  # ── Statistical Map Explorer ─────────────────────────────────────────────────

  statistical_map_thresholded:
    label: "Thresholded Statistical Map"
    description: "Input statistical NIfTI with sub-threshold voxels zeroed out"
    extensions: [".nii.gz", ".nii"]

  cluster_table_csv:
    label: "Cluster Table CSV"
    description: "Per-cluster statistics: size, peak, mean, MNI coordinates, center of mass, bounding box"
    extensions: [".csv"]

  cluster_table_json:
    label: "Cluster Table JSON"
    description: "Machine-readable cluster table with run provenance metadata"
    extensions: [".json"]

  cluster_overlay_png:
    label: "Cluster Overlay Figure"
    description: "Mosaic of axial slices showing thresholded statistical map overlaid on brain anatomy"
    extensions: [".png"]

  cluster_report_html:
    label: "Cluster Report"
    description: "Self-contained HTML cluster report with summary, overlay figure, cluster table, and methods"
    extensions: [".html"]

  cluster_metadata_json:
    label: "Cluster Run Metadata"
    description: "Provenance record: input, threshold, direction, cluster count, image shape, library versions"
    extensions: [".json"]

  # ── FSL FAST tissue segmentation ─────────────────────────────────────────────

  tissue_class_map:
    label: "Tissue Segmentation Map"
    description: "Hard tissue classification: 0=background, 1=CSF, 2=GM, 3=WM (from FSL FAST _seg.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  tissue_pve_csf:
    label: "CSF Partial Volume"
    description: "Voxelwise CSF partial-volume estimate (0–1) from FSL FAST (_pve_0.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  tissue_pve_gm:
    label: "GM Partial Volume"
    description: "Voxelwise grey matter partial-volume estimate (0–1) from FSL FAST (_pve_1.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  tissue_pve_wm:
    label: "WM Partial Volume"
    description: "Voxelwise white matter partial-volume estimate (0–1) from FSL FAST (_pve_2.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  bias_field:
    label: "Estimated Bias Field"
    description: "MRI B1 inhomogeneity field estimated by FSL FAST (_bias.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  restored_image:
    label: "Bias-Corrected Image"
    description: "Structural image with estimated bias field removed by FSL FAST (_restore.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  # ── FSL FLIRT registration ────────────────────────────────────────────────────

  registered_image:
    label: "Registered Image"
    description: "NIfTI image linearly registered to a reference space by FSL FLIRT"
    extensions: [".nii", ".nii.gz"]

  affine_matrix:
    label: "Affine Matrix"
    description: "FSL-format 4×4 affine transformation matrix from FLIRT (.mat, ASCII)"
    extensions: [".mat"]

  # ── FSL FNIRT nonlinear registration ─────────────────────────────────────────

  nonlinear_registered_image:
    label: "Nonlinearly Registered Image"
    description: "NIfTI image resampled into reference space by FSL FNIRT (fnirt_result.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  coefficient_field:
    label: "Warp Coefficient Field"
    description: "B-spline warp coefficient field from FSL FNIRT; required for applywarp (fnirt_warpcoef.nii.gz)"
    extensions: [".nii", ".nii.gz"]

  warp_field:
    label: "Displacement Field"
    description: "Full voxelwise displacement field in mm from FSL FNIRT (fnirt_field.nii.gz); present only when output-field=true"
    extensions: [".nii", ".nii.gz"]

  jacobian_image:
    label: "Jacobian Map"
    description: "Jacobian determinant map encoding local volumetric change from FSL FNIRT (fnirt_jac.nii.gz); present only when output-jacobian=true"
    extensions: [".nii", ".nii.gz"]
