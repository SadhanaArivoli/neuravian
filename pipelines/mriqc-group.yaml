id: mriqc-group
display_name: MRIQC Group Report
description: >
  Uses the established MRIQC group analysis to aggregate completed participant
  metrics into group HTML reports and TSV tables. Interpretation remains the
  researcher's responsibility.
homepage: https://mriqc.readthedocs.io/en/24.0.2/running.html

container:
  image: nipreps/mriqc
  tag: 24.0.2
  engine: docker

inputs:
  - mriqc_report
outputs:
  - mriqc_group_report

compute_profile: local-ok
category: quality_control
input_type: bids_dataset
preflight:
  empirical_status: verified
  required_os: Linux
  required_architecture: x86_64
  architecture_mismatch: warning
  requires_valid_bids: true
  license_parameters: []
  ports: []
  resources:
    min_ram_gb: 4
    recommended_ram_gb: 8
    min_cpu_count: 1
    recommended_cpu_count: 2
    min_disk_free_gb: 2
    working_space_gb: 1
    output_space_gb: 1

seed_output_from_lineage_artifact_type: mriqc_report

parameters:
  - name: analysis_level
    type: select
    required: true
    default: group
    options: [group]
    positional_index: 1
    help: >
      MRIQC group mode aggregates IQM JSON files that were produced by a
      prior participant-level MRIQC run. Neuravian keeps this fixed to
      group for the dedicated group-report pipeline.

  - name: upstream-mriqc-dir
    type: directory_path
    required: true
    internal: true
    help: >
      Internal Neuravian lineage path. This is copied into the run output
      directory before MRIQC group mode starts; it is not passed to MRIQC as
      a command-line flag.

  - name: no-sub
    type: boolean
    default: true
    advanced: true
    help: >
      Disable MRIQC's optional anonymized metrics submission. Neuravian
      keeps this enabled by default to avoid sending data without explicit
      user intent.

  - name: modalities
    type: multiselect
    options: [T1w, T2w, bold]
    advanced: true
    help: >
      Optional modalities to aggregate. Leave blank to let MRIQC discover
      modalities from the precomputed participant outputs.

  - name: nprocs
    type: integer
    default: 1
    advanced: true
    help: >
      Number of worker processes. Group aggregation is lightweight compared
      with participant-level MRIQC, so 1 is usually enough.

  - name: omp-nthreads
    type: integer
    default: 1
    advanced: true
    help: >
      Threads per process. Keep at 1 for predictable local execution.

accepts:
  - type: mriqc_report
    param: upstream-mriqc-dir
    label: Participant MRIQC Report
    description: >
      A completed participant-level MRIQC output directory containing per-run
      IQM JSON files.
    required: true

produces:
  - type: mriqc_group_report
    path_hint: ""
    label: MRIQC Group Report
    description: "Group-level MRIQC HTML reports and aggregate IQM TSV tables"

max_runtime_hours: 1

contract:
  version: 1
  unit_of_work: group
  lifecycle:
    expected_duration_minutes: 15
    heartbeat_timeout_minutes: 10
    cancellation_grace_seconds: 30
    retry_mode: fresh
    resume_strategy: none
    preserve_work_directory: false
  progress:
    strategy: stages
    stages:
      - id: discover
        label: Finding participant metrics
        pattern: "(IQM|JSON|BIDS layout)"
        weight: 1
      - id: aggregate
        label: Building group summary
        pattern: "(group|Group|Generating report)"
        weight: 2
  bids_app:
    analysis_levels: [group]
    analysis_level_parameter: analysis_level
    derivative_name: mriqc
    input_mount: /data
    output_mount: /out
  reporting:
    html_globs: ["**/*group*.html", "**/*.html"]
    figure_globs: ["**/*.svg", "**/*.png"]
    metric_globs: ["group_*.tsv", "sub-*/**/*.json"]
    qc_artifact_types: [mriqc_group_report]
  methods:
    runtime_version_pattern: 'Running MRIQC version (?P<version>\S+)'
    summary: >
      Group-level quality-control summaries were generated with {display_name}
      {version}, executed by Neuravian using {execution} from recorded
      participant-level MRIQC derivatives.
    citations:
      - key: mriqc
        authors: Esteban et al.
        year: 2017
        title: "MRIQC: Advancing the Automatic Prediction of Image Quality in MRI from Unseen Sites"
        journal: PLOS ONE
        volume: "12"
        issue: "9"
        pages: e0184661
        doi: 10.1371/journal.pone.0184661
        rrid: SCR_022942

known_errors:
  - pattern: "No IQM-JSON files were found|No files were found|No input runs"
    explanation: >
      MRIQC group mode did not find participant-level IQM JSON files to
      aggregate in the upstream MRIQC output directory.
    fix_hint: >
      Run participant-level MRIQC successfully first, then launch MRIQC Group
      Report from that run's Run Next recommendation.

  - pattern: "BIDSLayoutIndexer|database is locked|sqlite"
    explanation: >
      MRIQC could not read or update its local BIDS layout cache.
    fix_hint: >
      Retry the run. If it repeats, remove the copied .bids_db folder from the
      failed group output directory and launch a fresh group report.

command_template: >
  docker run --rm
  -v {dataset_path}:/data:ro
  -v {output_dir}:/out:rw
  nipreps/mriqc:24.0.2
  /data /out group --no-sub --nprocs {nprocs} --omp-nthreads {omp-nthreads}
