id: statistical-map-explorer
display_name: Statistical Map Explorer
description: >
  Threshold a statistical NIfTI map (z-map, t-map, beta map, contrast map,
  seed connectivity map, ALFF, or ReHo), detect suprathreshold clusters using
  6-connectivity connected-component labelling, compute cluster statistics
  (size, peak, mean, MNI coordinates, center of mass, bounding box), and
  generate a self-contained HTML report with a cluster overlay figure and
  CSV/JSON cluster table. All computation is native Python — no FSL, AFNI,
  SPM, or ANTs required.
homepage: https://docs.scipy.org/doc/scipy/reference/generated/scipy.ndimage.label.html
category: connectivity
input_type: nifti

execution:
  type: native
  command: neuroforge-statistical-map-explorer

dataset_positional: false
compute_profile: local-ok

inputs:
  - seed_connectivity_map_nii
  - alff_map_nii
  - falff_map_nii
  - alff_normalized_map_nii
  - falff_normalized_map_nii
  - statistical_map_thresholded
  - nifti_raw

accepts:
  - {type: seed_connectivity_map_nii, param: input-file, label: "Seed Connectivity Map", description: "Explore a voxelwise connectivity map"}
  - {type: alff_map_nii, param: input-file, label: "ALFF Map", description: "Explore a voxelwise raw ALFF map"}
  - {type: falff_map_nii, param: input-file, label: "fALFF Map", description: "Explore a voxelwise raw fALFF map"}
  - {type: alff_normalized_map_nii, param: input-file, label: "Normalized ALFF Map", description: "Explore a normalized ALFF map"}
  - {type: falff_normalized_map_nii, param: input-file, label: "Normalized fALFF Map", description: "Explore a normalized fALFF map"}
  - {type: reho_map_nii, param: input-file, label: "ReHo Map", description: "Explore a voxelwise regional homogeneity (KCC) map"}
  - {type: reho_normalized_map_nii, param: input-file, label: "Normalized ReHo Map", description: "Explore a z-score normalized ReHo map"}
  - {type: statistical_map_thresholded, param: input-file, label: "Thresholded Statistical Map", description: "Re-explore a prior thresholded map"}
  - {type: nifti_raw, param: input-file, label: "Raw NIfTI", description: "Explore a compatible scalar NIfTI"}

outputs:
  - statistical_map_thresholded
  - cluster_table_csv
  - cluster_table_json
  - cluster_overlay_png
  - cluster_report_html
  - cluster_metadata_json

parameters:
  - name: input-file
    type: file_path
    required: true
    help: >
      Path to the NIfTI file (.nii or .nii.gz).
      Accepted map types: z-map, t-map, beta map, contrast map,
      seed-based correlation map, ALFF, ReHo, or any single-volume float image.
      This is normally filled automatically from a prior seed-based connectivity run.

  - name: output-dir
    type: directory_path
    required: false
    default: "{output_dir}"
    advanced: true
    help: >
      Output directory for all cluster analysis files. Leave unchanged
      unless debugging the native command.

  - name: threshold
    type: float
    required: false
    default: 2.3
    help: >
      Absolute threshold applied to the statistic value before clustering.
      Voxels below this value (positive direction), above its negation
      (negative direction), or below it in absolute value (two-sided) are
      set to zero and excluded from cluster detection.
      Typical values: 2.3 (z > 2.3, p < 0.01 uncorrected),
      3.1 (z > 3.1, p < 0.001 uncorrected).

  - name: direction
    type: select
    required: false
    default: positive
    options:
      - positive
      - negative
      - two-sided
    help: >
      Which side of the distribution to threshold.
      "positive": keep voxels >= threshold (activations).
      "negative": keep voxels <= -threshold (deactivations).
      "two-sided": keep |value| >= threshold (both sides).

  - name: min-cluster-size
    type: integer
    required: false
    default: 10
    help: >
      Discard clusters smaller than this many voxels after thresholding.
      Reduces sensitivity to isolated noise voxels. Default is 10.

  - name: colormap
    type: select
    required: false
    default: hot
    options:
      - hot
      - cold
      - hot_cold
      - viridis
      - plasma
      - bwr
    help: >
      Colormap for the cluster overlay figure.
      "hot": warm red-yellow (activations).
      "cold": cool blue-green (deactivations).
      "hot_cold": diverging red-blue (two-sided maps).
      "bwr": blue-white-red (symmetric around zero).

known_errors:
  - pattern: "Input file not found"
    explanation: >
      The specified NIfTI file does not exist at the given path.
      Check that the path is correct and that the file has been transferred
      to the expected location.
      Verify the input path and re-run.


  - pattern: "Expected 3D or 4D NIfTI"
    explanation: >
      The input file has an unexpected number of dimensions. This tool
      accepts single-volume (3D) images or 4D images (first volume is used).
      Check the NIfTI header with the NIfTI Inspector tool.

  - pattern: "No suprathreshold voxels"
    explanation: >
      No voxels survived the threshold. The statistical map may have very
      low values, or the threshold may be too high for this dataset.
      Try lowering the threshold or changing the direction.
