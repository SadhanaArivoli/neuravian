id: mriqc
display_name: MRIQC
description: >
  Runs the established MRIQC research tool to calculate image quality metrics
  and participant reports. Neuravian orchestrates and records the run; you
  remain responsible for interpreting the quality-control results.
homepage: https://mriqc.readthedocs.io/en/24.0.2/
compute_profile: local-ok
category: quality_control
input_type: bids_dataset
preflight:
  empirical_status: verified
  required_os: Linux
  required_architecture: x86_64
  architecture_mismatch: warning
  requires_valid_bids: true
  license_parameters: []
  ports: []
  resources:
    min_ram_gb: 6
    recommended_ram_gb: 16
    min_cpu_count: 1
    recommended_cpu_count: 4
    min_disk_free_gb: 10
    working_space_gb: 5
    output_space_gb: 5
container:
  image: nipreps/mriqc
  tag: "24.0.2"
  engine: docker

inputs:
  - bids_dataset

outputs:
  - mriqc

parameters:
  # ── Basic ──────────────────────────────────────────────────────────
  - name: analysis_level
    type: select
    required: true
    default: participant
    positional_index: 1
    options:
      - participant
    help: >
      Calculate metrics and reports for each selected participant. Use the
      dedicated MRIQC Group Report pipeline after participant processing.

  - name: participant-label
    type: string
    required: false
    multiple: true
    help: >
      Restrict processing to one or more subjects, e.g. "01" or "01 02 03"
      (space-separated). Leave blank to process every subject in the dataset
      — on large datasets this can take hours.

  - name: session-id
    type: string
    required: false
    multiple: true
    help: >
      Filter by session label (the part after "ses-"), e.g. "baseline followup".
      Only needed if your dataset has session folders (ses-*). Leave blank for
      datasets without session structure (most single-session datasets).

  - name: task-id
    type: string
    required: false
    multiple: true
    help: >
      Filter by functional task name (the part after "task-"), e.g. "rest nback".
      Leave blank to include all tasks.

  - name: modalities
    type: multiselect
    required: false
    options:
      - T1w
      - T2w
      - bold
    help: >
      Limit which MRI modalities MRIQC inspects. Leave blank to process
      all modalities found in the dataset.

  # ── Performance ────────────────────────────────────────────────────
  - name: nprocs
    type: integer
    required: false
    default: 1
    help: >
      Number of subjects to process in parallel. Each nipype worker process
      loads the full pipeline (including PyTorch for skull-stripping), so
      memory scales linearly with this value. Default 1 is safe on all
      machines. Increase to 2-4 only on x86 machines with 16+ GB RAM free
      for Docker. On Apple Silicon Macs the MRIQC image runs under x86
      emulation — keep nprocs=1 to avoid memory exhaustion.

  - name: mem
    type: float
    required: false
    help: >
      Upper memory limit in GB. MRIQC will try to stay within this
      budget when scheduling parallel work. Leave blank for no cap.

  - name: omp-nthreads
    type: integer
    required: false
    default: 1
    advanced: true
    help: >
      Threads per process for OpenMP tools (ANTs, FSL). Keep at 1 on Apple
      Silicon (x86 emulation makes extra threads expensive). On native x86
      with 8+ cores, 2-4 speeds up ANTs registration noticeably.

  - name: ants-float
    type: boolean
    required: false
    default: true
    advanced: true
    help: >
      Use 32-bit float precision inside ANTs. Halves ANTs memory usage
      (from ~3 GB to ~1.5 GB) with negligible effect on IQM accuracy.
      Strongly recommended on machines with limited Docker memory.

  - name: float32
    type: boolean
    required: false
    default: false
    advanced: true
    help: >
      Cast input data to 32-bit float before processing. Halves memory
      usage at the cost of slight numeric precision.

  # ── Outputs ────────────────────────────────────────────────────────
  - name: work-dir
    type: directory_path
    required: false
    advanced: true
    help: >
      Directory for intermediate working files. Useful if you want to
      inspect nipype workflow outputs or resume an interrupted run.

  - name: verbose-reports
    type: boolean
    required: false
    default: false
    advanced: true
    help: >
      Include additional plots and diagnostic figures in the HTML
      reports (increases report file size).

  - name: reports-only
    type: boolean
    required: false
    default: false
    advanced: true
    help: >
      Skip metric computation and only regenerate HTML reports from a
      previous run's outputs.

  - name: no-sub
    type: boolean
    required: false
    default: true
    advanced: true
    help: >
      Keep MRIQC's optional anonymized metrics submission disabled. Neuravian
      enables this by default so no metrics leave your machine unexpectedly.

accepts:
  - type: bids_dataset
    dataset_slot: true
    label: "BIDS Dataset"
    description: "Any BIDS-organized dataset; select from the Datasets list"
  - type: bids_dataset_validated
    dataset_slot: true
    label: "Validated BIDS Dataset"
    description: "Recommended: output of a successful BIDS Validator run"

produces:
  - type: mriqc_report
    path_hint: ""
    label: "MRIQC Report"
    description: "HTML reports and image quality metrics (IQMs) for all participants"

max_runtime_hours: 6

contract:
  version: 1
  unit_of_work: participant
  lifecycle:
    expected_duration_minutes: 120
    heartbeat_timeout_minutes: 20
    cancellation_grace_seconds: 30
    retry_mode: fresh
    resume_strategy: none
    preserve_work_directory: true
  progress:
    strategy: stages
    stages:
      - id: initialize
        label: Preparing MRIQC workflow
        pattern: "(Building MRIQC|Initializing|BIDS layout)"
        weight: 1
      - id: process
        label: Calculating image quality metrics
        pattern: "(Computing|Running node|nipype.workflow|Estimating initial transform|Retry #[0-9]+|Successful spatial normalization)"
        weight: 6
      - id: reports
        label: Writing participant reports
        pattern: "(Generating visual report|Generating report|Writing report|Reports generated)"
        weight: 2
  bids_app:
    analysis_levels: [participant]
    analysis_level_parameter: analysis_level
    derivative_name: mriqc
    participant_parameter: participant-label
    session_parameter: session-id
    task_parameter: task-id
    work_directory_parameter: work-dir
    input_mount: /data
    output_mount: /out
    work_mount: /work
  reporting:
    html_globs: ["**/*.html"]
    figure_globs: ["**/*.svg", "**/*.png"]
    metric_globs: ["sub-*/**/*.json"]
    qc_artifact_types: [mriqc_report]
  methods:
    runtime_version_pattern: 'Running MRIQC version (?P<version>\S+)'
    summary: >
      Image quality metrics and visual quality-control reports were generated
      with {display_name} {version}, executed by Neuravian using {execution}.
    citations:
      - key: mriqc
        authors: Esteban et al.
        year: 2017
        title: "MRIQC: Advancing the Automatic Prediction of Image Quality in MRI from Unseen Sites"
        journal: PLOS ONE
        volume: "12"
        issue: "9"
        pages: e0184661
        doi: 10.1371/journal.pone.0184661
        rrid: SCR_022942

known_errors:
  - pattern: "participant labels were not found.*: (?P<labels>[^.]+)"
    explanation: MRIQC could not find one or more selected participants in this BIDS dataset.
    fix_hint: Choose a participant shown in the dataset and use the label with or without the sub- prefix.

  - pattern: "No such file or directory.*dataset_description\\.json"
    explanation: The selected folder is not a valid BIDS dataset — it is missing dataset_description.json at the root.
    fix_hint: Make sure you selected the top-level BIDS directory (the one that contains dataset_description.json, not a subdirectory).

  - pattern: "Cannot allocate memory|MemoryError|Killed"
    explanation: MRIQC ran out of memory during processing.
    fix_hint: Reduce the number of parallel processes ("nprocs") or lower the "mem" ceiling, then re-run.

  - pattern: "No NIfTI files found|No functional runs found"
    explanation: MRIQC found no images to process. This usually means the modality or task filter excluded everything.
    fix_hint: Check your "modalities" and "task-id" settings. Leave them blank to process all available data.

  - pattern: "FileNotFoundError.*license\\.txt|FREESURFER_HOME"
    explanation: MRIQC could not find a FreeSurfer license file. FreeSurfer is required for some structural metrics.
    fix_hint: Place your FreeSurfer license.txt in the output directory or bind-mount it into the container and set the FREESURFER_HOME environment variable.

  - pattern: "ERROR.*runtime error.*nipype"
    explanation: An internal nipype workflow node failed. This is often caused by corrupted input files or an out-of-disk-space condition.
    fix_hint: Check the log above this line for the node name, then inspect the file it was processing. Ensure you have enough disk space in the working directory.

command_template: >
  docker run --rm
  -v {bids_dir}:/data:ro
  -v {output_dir}:/out
  {work_dir_mount}
  nipreps/mriqc:24.0.2
  /data /out {analysis_level}
  {flags}

deprecated_params:
  run-id: bids-filter-file
