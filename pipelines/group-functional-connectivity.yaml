id: group-functional-connectivity
display_name: Group Functional Connectivity
description: >
  Aggregates multiple functional-connectivity runs (already computed by
  NeuroForge) into a group mean and standard-deviation connectivity matrix.
  Performs compatibility validation (same atlas, ROI count, and correlation
  method) and produces a mean heatmap, std heatmap, and summary report.
  Descriptive statistics only — no inferential testing.
category: connectivity
input_type: bids_dataset

execution:
  type: native
  command: neuroforge-group-functional-connectivity

dataset_positional: false
compute_profile: local-ok

inputs:
  - connectivity_matrix_csv

outputs:
  - group_mean_r_matrix_csv
  - group_mean_r_matrix_npy
  - group_mean_r_heatmap_png
  - group_mean_fisher_z_matrix_csv
  - group_mean_fisher_z_matrix_npy
  - group_mean_fisher_z_heatmap_png
  - group_std_fisher_z_matrix_csv
  - group_std_fisher_z_matrix_npy
  - group_std_fisher_z_heatmap_png
  - group_summary_json
  - group_report_html

parameters:
  - name: input-run-ids
    type: string
    required: true
    help: >
      Comma-separated list of NeuroForge functional-connectivity run IDs to
      aggregate. All runs must have used the same atlas and ROI ordering.
      This field is filled automatically by the multi-run selector.

  - name: matrix-dirs
    type: string
    required: false
    internal: true
    help: >
      Internal parameter. Comma-separated list of absolute output directory
      paths resolved from input-run-ids. Injected by the backend before
      execution — do not set this manually.

  - name: output-dir
    type: directory_path
    required: false
    default: "{output_dir}"
    advanced: true
    help: >
      Output directory for the group connectivity report bundle. Leave
      unchanged unless debugging the native command.

accepts:
  - type: connectivity_matrix_csv
    param: matrix-dirs
    label: "Connectivity Matrix CSV"
    description: >
      Pre-computed ROI-by-ROI connectivity matrices from one or more
      functional-connectivity runs. All matrices must share the same atlas,
      ROI count, and correlation method.
    required: true

produces:
  - type: group_mean_r_matrix_csv
    path_hint: "group_mean_r_matrix.csv"
    label: "Group Mean Connectivity Matrix (r)"
    description: >
      Primary result: mean Pearson correlation matrix back-transformed from
      Fisher z-space via tanh(mean_z). Diagonal = 1. Use this for downstream
      graph analysis and visualization.

  - type: group_mean_r_matrix_npy
    path_hint: "group_mean_r_matrix.npy"
    label: "Group Mean Connectivity Matrix (r, NPY)"
    description: "NumPy binary of the back-transformed mean r matrix"

  - type: group_mean_r_heatmap_png
    path_hint: "group_mean_r_heatmap.png"
    label: "Group Mean Heatmap (r)"
    description: "Heatmap of the group mean correlation matrix (r-space)"

  - type: group_mean_fisher_z_matrix_csv
    path_hint: "group_mean_fisher_z_matrix.csv"
    label: "Group Mean Connectivity Matrix (Fisher z)"
    description: >
      Mean connectivity in Fisher z-space (arctanh of individual run r matrices).
      Diagonal = 0. Use this for parametric group-level statistical analyses.

  - type: group_mean_fisher_z_matrix_npy
    path_hint: "group_mean_fisher_z_matrix.npy"
    label: "Group Mean Connectivity Matrix (Fisher z, NPY)"
    description: "NumPy binary of the mean Fisher z matrix"

  - type: group_mean_fisher_z_heatmap_png
    path_hint: "group_mean_fisher_z_heatmap.png"
    label: "Group Mean Heatmap (Fisher z)"
    description: "Heatmap of the group mean connectivity in Fisher z-space"

  - type: group_std_fisher_z_matrix_csv
    path_hint: "group_std_fisher_z_matrix.csv"
    label: "Group Std Connectivity Matrix (Fisher z)"
    description: "Sample standard deviation (ddof=1) in Fisher z-space across input runs"

  - type: group_std_fisher_z_matrix_npy
    path_hint: "group_std_fisher_z_matrix.npy"
    label: "Group Std Connectivity Matrix (Fisher z, NPY)"
    description: "NumPy binary of the z-space standard deviation matrix"

  - type: group_std_fisher_z_heatmap_png
    path_hint: "group_std_fisher_z_heatmap.png"
    label: "Group Std Heatmap (Fisher z)"
    description: "Heatmap of across-run standard deviation in Fisher z-space"

  - type: group_summary_json
    path_hint: "group_summary.json"
    label: "Group Summary"
    description: "Machine-readable summary including n_runs, atlas, ROI count, and statistics"

  - type: group_report_html
    path_hint: "group_report.html"
    label: "Group Connectivity Report"
    description: "HTML report summarizing group mean/std matrices and aggregation details"

known_errors:
  - pattern: "No matrix directories provided"
    explanation: >
      No functional-connectivity run output directories were resolved from
      the input-run-ids parameter. This usually means the run IDs are
      invalid or have no output directory recorded.
    fix_hint: >
      Ensure all selected runs completed successfully and have status
      "success" before running group aggregation.

  - pattern: "Atlas mismatch"
    explanation: >
      The selected runs used different atlases or ROI orderings and cannot
      be averaged. Group connectivity requires all input runs to use the
      same atlas.
    fix_hint: >
      Select only runs that were computed with the same atlas (e.g., all
      Schaefer 100-parcel or all AAL). Check the atlas field on each run
      in the Run Results page.

  - pattern: "Matrix dimension mismatch"
    explanation: >
      The connectivity matrices from the selected runs have different shapes
      and cannot be stacked for averaging.
    fix_hint: >
      Confirm that all selected runs used exactly the same atlas. Matrices
      must have identical row and column counts.

  - pattern: "Confound strategy mismatch"
    explanation: >
      The selected runs used different confound-regression strategies and
      cannot be aggregated. Averaging FC matrices with different nuisance
      regression (especially global signal regression) produces scientifically
      invalid group means because the strategies change the sign and magnitude
      of correlation values.
    fix_hint: >
      Select only FC runs computed with the same confound-strategy. Check the
      confound_strategy field on each run's metadata in Run Results. Re-run
      the FC pipeline with a consistent strategy if needed.
