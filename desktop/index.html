<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'" />
    <title>Neuravian</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="startup-shell" aria-labelledby="app-title">
      <img class="logo" src="neuravian-splash.png" alt="Neuravian logo" />
      <p class="kicker">LOCAL-FIRST NEUROIMAGING WORKSTATION</p>
      <h1 id="app-title">Neuravian</h1>
      <p class="subtitle">Local-first neuroimaging workstation</p>
      <section class="status-card" aria-live="polite">
        <span class="spinner" id="spinner" aria-hidden="true"></span>
        <div>
          <p class="status" id="startup-status">Checking system</p>
          <p class="detail" id="startup-detail">Preparing the desktop launcher…</p>
        </div>
      </section>
      <div class="actions" id="startup-actions" hidden>
        <button type="button" class="primary" id="retry">Retry</button>
        <button type="button" id="copy-diagnostics">Copy diagnostics</button>
        <button type="button" id="open-logs">Open logs</button>
        <button type="button" id="open-browser" hidden>Open Neuravian in browser</button>
        <button type="button" id="open-docker" hidden>Open Docker Desktop</button>
        <button type="button" id="install-docker" hidden>Install Docker Desktop</button>
      </div>
      <p class="failure-meta" id="failure-meta" hidden></p>
      <p class="feedback" id="feedback" aria-live="polite"></p>
      <p class="privacy">Neuravian is running locally. The desktop launcher does not upload your datasets.</p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
