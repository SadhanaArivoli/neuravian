appId: org.neuravian.desktop
productName: Neuravian
copyright: Copyright © 2026 Neuravian contributors
asar: true
directories:
  output: dist
files:
  - build/**/*
  - package.json
extraResources:
  - from: assets/neuravian-logo.png
    to: assets/neuravian-logo.png
mac:
  category: public.app-category.education
  icon: assets/Neuravian.icns
  target:
    - target: dir
      arch:
        - arm64
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
artifactName: ${productName}-${version}-${arch}.${ext}
