appId: org.neuravian.desktop
productName: Neuravian
copyright: Copyright © 2026 Neuravian contributors
asar: true
directories:
  output: dist
files:
  - build/**/*
  - package.json

extraResources:
  # App icon for in-app display
  - from: assets/neuravian-logo.png
    to: assets/neuravian-logo.png

  # Runtime assets bundled into Contents/Resources/app-resources/
  # Resolved at runtime via process.resourcesPath + "app-resources".
  - from: ../docker-compose.yml
    to: app-resources/docker-compose.yml
  - from: docker-compose.desktop.yml
    to: app-resources/desktop/docker-compose.desktop.yml
  - from: docker-compose.packaged.yml
    to: app-resources/desktop/docker-compose.packaged.yml
  - from: ../pipelines
    to: app-resources/pipelines
    filter:
      - "**/*.yaml"
      - "**/*.yml"
  - from: ../plugins
    to: app-resources/plugins

mac:
  category: public.app-category.education
  icon: assets/Neuravian.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64

dmg:
  title: Neuravian ${version}
  icon: assets/Neuravian.icns
  contents:
    - x: 180
      y: 170
      type: file
    - x: 480
      y: 170
      type: link
      path: /Applications

artifactName: ${productName}-${version}-${arch}.${ext}
