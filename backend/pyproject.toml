[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[project]
name = "neuroforge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.0.0",
    "aiofiles>=23.0.0",
    "bids-validator>=1.14.0",
    "pybids>=0.16.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.21.0",
    "docker>=7.0.0",
    "psutil>=5.9.0",
    "paramiko>=3.4.0",
    "websockets>=12.0",
    "nilearn>=0.14.0",
    "matplotlib>=3.11.0",
]

[project.scripts]
neuroforge-import-fmriprep-derivatives = "app.tools.import_fmriprep_derivatives:main"
neuroforge-functional-connectivity = "app.tools.functional_connectivity:main"
neuroforge-seed-based-connectivity = "app.tools.seed_based_connectivity:main"
neuroforge-group-functional-connectivity = "app.tools.group_functional_connectivity:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx2>=0.28.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
